<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Grow your streak</title>
    <style>
      @media only screen and (max-width: 480px) {
        .container { width: 100% !important; border-radius: 0 !important; }
        .px { padding-left: 24px !important; padding-right: 24px !important; }
        .hero-pad { padding: 32px 24px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#EEF0FA;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF0FA;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:100%;background-color:#ffffff;border-radius:20px;border:1px solid #ECECF5;overflow:hidden;">

            <!-- Logo bar -->
            <tr>
              <td class="px" style="padding:28px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td>
                      <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr>
                          <td style="width:26px;height:26px;background-color:#6C5DD3;border-radius:8px;text-align:center;vertical-align:middle;font-family:Arial,sans-serif;font-size:13px;color:#ffffff;line-height:26px;">&#10022;</td>
                          <td style="padding-left:9px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#14142B;">{{brand.name}}</td>
                        </tr>
                      </table>
                    </td>
                    <td align="right">
                      <span style="display:inline-block;background-color:#F0EDFC;color:#6C5DD3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.03em;padding:6px 12px;border-radius:999px;">HABIT REMINDER</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Hero -->
            <tr>
              <td class="hero-pad" style="padding:8px 40px 36px;background:linear-gradient(135deg,#6C5DD3,#8A78F0);">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:44px;height:44px;background-color:rgba(255,255,255,0.18);border-radius:12px;text-align:center;vertical-align:middle;font-family:Arial,sans-serif;font-size:20px;color:#ffffff;line-height:44px;">&#127793;</td>
                  </tr>
                </table>
                <h1 style="margin:18px 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.35;font-weight:800;color:#ffffff;">{{reminderTitle}}</h1>
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;color:rgba(255,255,255,0.85);">Don't forget to check off <strong style="color:#ffffff;">{{habit.title}}</strong> today — keep the streak alive.</p>
              </td>
            </tr>

            <!-- Reminder time card -->
            <tr>
              <td class="px" style="padding:32px 40px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F7F6FD;border:1px solid #ECE9FB;border-radius:16px;">
                  <tr>
                    <td style="padding:18px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                        <tr>
                          <td style="font-size:13px;color:#8A8FA8;">Reminder time</td>
                          <td style="font-size:14px;font-weight:700;color:#14142B;text-align:right;">{{habit.reminderTime}}</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- CTA -->
            <tr>
              <td class="px" align="center" style="padding:28px 40px 8px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:12px;background-color:#6C5DD3;">
                      <a href="{{app.habitUrl}}" style="display:inline-block;padding:15px 34px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">Mark it done</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td class="px" style="padding:28px 40px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#9AA0B4;text-align:center;">
                Sent because habit reminders are on &middot;
                <a href="{{app.preferencesUrl}}" style="color:#6C5DD3;text-decoration:underline;">Manage notifications</a>
              </td>
            </tr>

          </table>
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:100%;">
            <tr>
              <td align="center" style="padding:20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#B0B3C6;">
                &copy; {{brand.name}}. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
