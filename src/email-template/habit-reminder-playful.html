<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow your streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#EDF9F0; font-family:'Nunito',-apple-system,sans-serif; -webkit-text-size-adjust:100%; }
  .container { max-width:600px; margin:0 auto; }
  h1,.fredoka { font-family:'Fredoka',sans-serif; }
  @media only screen and (max-width:600px){
    .pad { padding-left:24px !important; padding-right:24px !important; }
    .charSvg { width:150px !important; height:150px !important; }
  }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EDF9F0;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px;">

  <!-- Banner -->
  <tr>
    <td style="border-radius:28px 28px 0 0; overflow:hidden;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:linear-gradient(135deg,#6EDC96 0%,#2ECC71 55%,#1E9E58 100%);">
        <tr>
          <td align="center" style="padding:38px 20px 0 20px; position:relative;">

            <!-- sparkles -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="position:absolute; top:0; left:0;">
              <tr><td style="padding:26px 0 0 44px;">
                <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z" fill="#FFF3B0"/></svg>
              </td></tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="position:absolute; top:0; right:0;">
              <tr><td style="padding:56px 40px 0 0;">
                <svg width="10" height="10" viewBox="0 0 16 16"><path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z" fill="#FFF3B0"/></svg>
              </td></tr>
            </table>

            <!-- Mascot: sprouting plant -->
            <svg class="charSvg" width="170" height="170" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto;">
              <!-- sun rays -->
              <circle cx="150" cy="35" r="14" fill="#FFE699"/>
              <g stroke="#FFE699" stroke-width="4" stroke-linecap="round">
                <line x1="150" y1="10" x2="150" y2="2"/>
                <line x1="172" y1="20" x2="178" y2="14"/>
                <line x1="128" y1="20" x2="122" y2="14"/>
              </g>
              <!-- stem -->
              <path d="M100 165 C100 120 100 100 100 85" stroke="#1E9E58" stroke-width="8" stroke-linecap="round" fill="none"/>
              <!-- leaves -->
              <path d="M100 130 C75 122 65 100 78 82 C95 95 100 112 100 130 Z" fill="#3FCB7A"/>
              <path d="M100 115 C125 107 135 88 122 70 C105 83 100 98 100 115 Z" fill="#6EDC96"/>
              <!-- bud -->
              <circle cx="100" cy="78" r="16" fill="#FFF3B0"/>
              <circle cx="100" cy="78" r="9" fill="#FFC94D"/>
              <!-- pot -->
              <path d="M62 165 L138 165 L128 200 L72 200 Z" fill="#D97757"/>
              <rect x="58" y="155" width="84" height="14" rx="7" fill="#C25F42"/>
              <!-- face on pot -->
              <circle cx="86" cy="182" r="4" fill="#3A2A22"/>
              <circle cx="114" cy="182" r="4" fill="#3A2A22"/>
              <path d="M88 191 Q100 197 112 191" stroke="#3A2A22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            </svg>

            <p class="fredoka" style="margin:14px 0 0 0; font-size:13px; font-weight:600; letter-spacing:1px; color:#DFFBE9; text-transform:uppercase;">Habit &middot; today</p>
          </td>
        </tr>
        <tr>
          <td style="line-height:0; font-size:0;">
            <svg viewBox="0 0 600 40" width="100%" height="40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0,20 C100,45 200,0 300,15 C400,30 500,0 600,20 L600,40 L0,40 Z" fill="#FFFFFF"/>
            </svg>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Card body -->
  <tr>
    <td style="background:#FFFFFF; border-radius:0 0 28px 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td class="pad" style="padding:8px 40px 0 40px;" align="center">
            <h1 class="fredoka" style="margin:0; font-size:26px; line-height:1.3; color:#2B2B2B; font-weight:600; text-align:center;">
              {{reminderTitle}}
            </h1>
            <p style="margin:12px 0 0 0; font-size:15px; line-height:1.6; color:#7A7A7A; text-align:center;">
              Don't forget to check off &ldquo;{{habit.title}}&rdquo; today &mdash; keep it growing!
            </p>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:24px 40px 0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EAFBF0; border-radius:14px;">
              <tr><td style="padding:16px 20px; text-align:center;">
                <div class="fredoka" style="font-size:11px; color:#1E9E58; text-transform:uppercase; letter-spacing:0.5px;">Reminder time</div>
                <div style="font-size:15px; font-weight:800; color:#2B2B2B; margin-top:2px;">{{habit.reminderTime}}</div>
              </td></tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:28px 40px 0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:100px; background:linear-gradient(135deg,#6EDC96,#1E9E58);">
                  <a href="{{app.habitUrl}}" class="fredoka" style="display:inline-block; padding:14px 34px; font-size:15px; font-weight:600; color:#FFFFFF;">Mark it done &rarr;</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:30px 40px 32px 40px;" align="center">
            <p style="margin:0; font-size:12px; line-height:1.6; color:#B7B0AA; text-align:center;">
              Sent because habit reminders are on. <a href="{{app.preferencesUrl}}" style="color:#1E9E58; text-decoration:underline;">Manage notifications</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>
