<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow your streak</title>
<style>
  body { margin:0; padding:0; background:#F4F6F5; -webkit-text-size-adjust:100%; }
  .container { max-width:560px; margin:0 auto; }
  @media only screen and (max-width:600px){
    .pad { padding-left:24px !important; padding-right:24px !important; }
  }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F5;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px;">

  <!-- Wordmark row -->
  <tr>
    <td style="padding:0 4px 18px 4px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; color:#1B1F1C; letter-spacing:0.2px;">Finamite</td>
          <td align="right" style="font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; color:#8A9690; letter-spacing:0.8px; text-transform:uppercase;">Habit reminder</td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Top accent bar -->
  <tr>
    <td style="background:#2F9E5C; height:6px; line-height:6px; font-size:0; border-radius:14px 14px 0 0;">&nbsp;</td>
  </tr>

  <!-- Card -->
  <tr>
    <td style="background:#FFFFFF; border:1px solid #E6EAE7; border-top:none; border-radius:0 0 14px 14px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

        <!-- Badge -->
        <tr>
          <td align="center" style="padding:38px 40px 0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td width="56" height="56" align="center" valign="middle" style="background:#E6F5EA; border-radius:50%; font-size:24px; line-height:56px;">🌱</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:20px 40px 0 40px;" align="center">
            <h1 style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:23px; line-height:1.35; color:#161A17; font-weight:700; text-align:center;">
              {{reminderTitle}}
            </h1>
            <p style="margin:12px 0 0 0; font-family:Helvetica,Arial,sans-serif; font-size:14.5px; line-height:1.65; color:#5C665F; text-align:center;">
              Don't forget to check off <strong style="color:#2F2F2F;">{{habit.title}}</strong> today &mdash; keep the streak alive.
            </p>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="padding:26px 40px 0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #EEF1EF; font-size:0; line-height:0;">&nbsp;</td></tr></table>
          </td>
        </tr>

        <!-- Info row -->
        <tr>
          <td class="pad" style="padding:22px 40px 0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; color:#8A9690; text-transform:uppercase; letter-spacing:0.6px;">Reminder time</td>
                <td align="right" style="font-family:Georgia,'Times New Roman',serif; font-size:14.5px; font-weight:700; color:#1B1F1C;">{{habit.reminderTime}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding:28px 40px 0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td align="center" bgcolor="#1E7A44" style="border-radius:8px; background:#1E7A44;">
                  <a href="{{app.habitUrl}}" style="display:block; padding:14px 0; font-family:Helvetica,Arial,sans-serif; font-size:14.5px; font-weight:700; color:#FFFFFF; text-decoration:none; text-align:center;">Mark it done</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:28px 40px 34px 40px;" align="center">
            <p style="margin:0; font-family:Helvetica,Arial,sans-serif; font-size:11.5px; line-height:1.6; color:#AEB6B0; text-align:center;">
              Sent because habit reminders are on &middot; <a href="{{app.preferencesUrl}}" style="color:#6F8378; text-decoration:underline;">Manage notifications</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>

  <tr>
    <td align="center" style="padding:20px 0 0 0;">
      <p style="margin:0; font-family:Helvetica,Arial,sans-serif; font-size:11.5px; color:#AEB6B0;">Finamite, inc.</p>
    </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>
