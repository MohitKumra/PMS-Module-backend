<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tick tock!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#FBF3EA; font-family:'Nunito',-apple-system,sans-serif; -webkit-text-size-adjust:100%; }
  .container { max-width:600px; margin:0 auto; }
  h1,.fredoka { font-family:'Fredoka',sans-serif; }
  @media only screen and (max-width:600px){
    .pad { padding-left:24px !important; padding-right:24px !important; }
    .charSvg { width:150px !important; height:150px !important; }
  }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF3EA;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px;">

  <!-- Banner -->
  <tr>
    <td style="border-radius:28px 28px 0 0; overflow:hidden;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:linear-gradient(135deg,#FF8C63 0%,#FF5F45 60%,#F23C4E 100%); position:relative;">
        <tr>
          <td align="center" style="padding:38px 20px 0 20px; position:relative;">

            <!-- confetti dots -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="position:absolute; top:0; left:0;">
              <tr>
                <td style="padding:24px 0 0 40px;"><div style="width:8px;height:8px;border-radius:50%;background:#FFD86B;"></div></td>
              </tr>
            </table>

            <!-- Mascot: alarm clock -->
            <svg class="charSvg" width="170" height="170" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto;">
              <!-- ring lines -->
              <path d="M40 45 Q20 25 8 40" stroke="#FFE3B0" stroke-width="6" stroke-linecap="round" fill="none"/>
              <path d="M160 45 Q180 25 192 40" stroke="#FFE3B0" stroke-width="6" stroke-linecap="round" fill="none"/>
              <path d="M30 60 Q10 55 4 65" stroke="#FFE3B0" stroke-width="5" stroke-linecap="round" fill="none"/>
              <path d="M170 60 Q190 55 196 65" stroke="#FFE3B0" stroke-width="5" stroke-linecap="round" fill="none"/>
              <!-- bells -->
              <circle cx="55" cy="42" r="20" fill="#FFC94D"/>
              <circle cx="145" cy="42" r="20" fill="#FFC94D"/>
              <!-- feet -->
              <rect x="70" y="168" width="16" height="18" rx="6" fill="#C23616"/>
              <rect x="114" y="168" width="16" height="18" rx="6" fill="#C23616"/>
              <!-- body -->
              <circle cx="100" cy="110" r="72" fill="#FFF4E6"/>
              <circle cx="100" cy="110" r="72" fill="none" stroke="#FFC94D" stroke-width="10"/>
              <!-- hands -->
              <line x1="100" y1="110" x2="100" y2="72" stroke="#F23C4E" stroke-width="6" stroke-linecap="round"/>
              <line x1="100" y1="110" x2="128" y2="110" stroke="#F23C4E" stroke-width="6" stroke-linecap="round"/>
              <circle cx="100" cy="110" r="6" fill="#F23C4E"/>
              <!-- face -->
              <circle cx="78" cy="130" r="5" fill="#3A3A3A"/>
              <circle cx="122" cy="130" r="5" fill="#3A3A3A"/>
              <path d="M85 148 Q100 158 115 148" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round" fill="none"/>
            </svg>

            <p class="fredoka" style="margin:16px 0 0 0; font-size:13px; font-weight:600; letter-spacing:1px; color:#FFE3D6; text-transform:uppercase;">Task &middot; due in 15 min</p>
          </td>
        </tr>
        <!-- wave divider -->
        <tr>
          <td style="line-height:0; font-size:0;">
            <svg viewBox="0 0 600 40" width="100%" height="40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0,20 C100,45 200,0 300,15 C400,30 500,0 600,20 L600,40 L0,40 Z" fill="#FFFFFF"/>
            </svg>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Card body -->
  <tr>
    <td style="background:#FFFFFF; border-radius:0 0 28px 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td class="pad" style="padding:8px 40px 0 40px;" align="center">
            <h1 class="fredoka" style="margin:0; font-size:26px; line-height:1.3; color:#2B2B2B; font-weight:600; text-align:center;">
              {{task.title}}
            </h1>
            <p style="margin:12px 0 0 0; font-size:15px; line-height:1.6; color:#7A7A7A; text-align:center;">
              {{#if task.description}}&ldquo;{{task.description}}&rdquo; &mdash; less than 15 minutes to go!{{else}}Less than 15 minutes to go &mdash; you've got this!{{/if}}
            </p>
          </td>
        </tr>

        <!-- chips -->
        <tr>
          <td class="pad" style="padding:24px 40px 0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td width="50%" style="padding-right:6px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF1E8; border-radius:14px;">
                    <tr><td style="padding:14px 16px; text-align:center;">
                      <div class="fredoka" style="font-size:11px; color:#F23C4E; text-transform:uppercase; letter-spacing:0.5px;">Due</div>
                      <div style="font-size:14px; font-weight:800; color:#2B2B2B; margin-top:2px;">{{task.dueDate}}</div>
                    </td></tr>
                  </table>
                </td>
                <td width="50%" style="padding-left:6px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF1E8; border-radius:14px;">
                    <tr><td style="padding:14px 16px; text-align:center;">
                      <div class="fredoka" style="font-size:11px; color:#F23C4E; text-transform:uppercase; letter-spacing:0.5px;">Priority</div>
                      <div style="font-size:14px; font-weight:800; color:#2B2B2B; margin-top:2px;">{{task.priority}}</div>
                    </td></tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding:28px 40px 0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:100px; background:linear-gradient(135deg,#FF8C63,#F23C4E);">
                  <a href="{{app.taskUrl}}" class="fredoka" style="display:inline-block; padding:14px 34px; font-size:15px; font-weight:600; color:#FFFFFF;">Let's do this &rarr;</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:30px 40px 32px 40px;" align="center">
            <p style="margin:0; font-size:12px; line-height:1.6; color:#B7B0AA; text-align:center;">
              Sent because task reminders are on. <a href="{{app.preferencesUrl}}" style="color:#F23C4E; text-decoration:underline;">Manage notifications</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>
